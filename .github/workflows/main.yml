name: Build APK Manual

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Configura Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 2. Libera espaço em disco (Evita erros no meio do processo)
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 3. Instala as dependências do Linux
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev \
            libncursesw5-dev libffi-dev uuid-dev openjdk-17-jdk unzip

      # 4. Instala Buildozer
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer
          pip install "cython<3"

      # 5. O PULO DO GATO: Baixa SDK, Aceita Licenças e Compila
      - name: Build APK (Fix License)
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          
          # Tentativa 1: Roda para baixar o SDK (Sabemos que vai falhar na licença, então usamos || true para não parar)
          echo "y" | buildozer android debug || true
          
          # Correção: Encontra o instalador do Android escondido e força o aceite da licença
          echo "Aceitando licenças manualmente..."
          find ~/.buildozer -name sdkmanager -exec {} --licenses <<< "y\ny\ny\ny\ny\ny\ny\ny" \; || true
          
          # Tentativa 2: Agora roda para valer (Vai funcionar)
          buildozer android debug

      # 6. Salva o APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bry-download-pro
          path: bin/*.apk
