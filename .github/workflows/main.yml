name: Build APK Fix

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 1. Configura Python 3.9 (Estável)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 2. Limpeza de Disco
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 3. Instala dependências do Sistema
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev \
            libncursesw5-dev libffi-dev uuid-dev openjdk-17-jdk unzip \
            libltdl-dev autoconf libtool pkg-config

      # 4. Instala Buildozer
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer
          pip install "cython<3"

      # 5. Compilação com Aceite de Licença Separado
      - name: Build APK
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          
          # 1. Faz o Buildozer baixar o SDK (vai falhar na licença, mas baixa os arquivos)
          echo "y" | buildozer android debug || true
          
          # 2. Aceita as licenças manualmente usando o sdkmanager oficial
          echo "Aceitando licenças..."
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true
          
          # 3. Limpa builds anteriores quebrados
          buildozer android clean
          
          # 4. Roda o build final (Agora sem o 'yes |' para não dar broken pipe)
          buildozer android debug

      # 6. Upload do APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bry-download-pro
          path: bin/*.apk
