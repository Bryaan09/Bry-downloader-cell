name: Build APK Final

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite rodar manualmente clicando num botão

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 1. Configura Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 2. Instala dependências do sistema
      # (Sem a etapa de 'Free Disk Space' que estava travando)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev \
            libncursesw5-dev libffi-dev uuid-dev openjdk-17-jdk unzip \
            libltdl-dev autoconf libtool pkg-config

      # 3. Instala Buildozer
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer
          pip install "cython<3"

      # 4. Compila o APK
      - name: Build APK
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          
          # Tenta iniciar para baixar o SDK
          echo "y" | buildozer android debug || true
          
          # Aceita as licenças manualmente (Garante que não trave)
          echo "Aceitando licenças..."
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true
          
          # Limpa builds anteriores
          buildozer android clean
          
          # Roda o build final
          buildozer android debug

      # 5. Salva o APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bry-download-pro
          path: bin/*.apk
