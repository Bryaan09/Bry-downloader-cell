name: Build APK Manual

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa seu código
      - uses: actions/checkout@v4

      # 2. Prepara o Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Libera espaço (Essencial para não travar)
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 4. Instala as dependências do Linux
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev \
            libncursesw5-dev libffi-dev uuid-dev openjdk-17-jdk unzip

      # 5. Instala o Buildozer
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer
          pip install "cython<3"

      # 6. Roda o comando de criar o APK (CORRIGIDO AQUI)
      # O "yes |" serve para aceitar a licença automaticamente
      - name: Build APK
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          yes | buildozer android debug

      # 7. Salva o APK para você baixar
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bry-download-pro
          path: bin/*.apk
