name: Build APK Final

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 1. Configura Python 3.9 (O mais estável para Buildozer)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 2. Libera espaço em disco
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # 3. Instala dependências do sistema
      # CORREÇÃO REALIZADA: Removidos libgstreamer e plugins que travavam a instalação
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev \
            libncursesw5-dev libffi-dev uuid-dev openjdk-17-jdk unzip \
            libltdl-dev autoconf libtool pkg-config

      # 4. Instala Buildozer
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer
          pip install "cython<3"

      # 5. Compila o APK (Com correção de licença)
      - name: Build APK
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          
          # Tenta iniciar para baixar o SDK
          echo "y" | buildozer android debug || true
          
          # Garante o aceite das licenças
          echo "Aceitando licenças..."
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true
          
          # Roda o build final
          buildozer android clean
          buildozer android debug

      # 6. Upload do APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bry-download-pro
          path: bin/*.apk
